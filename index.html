<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>0xRushi</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --p1: #c084fc;
      --p2: #a855f7;
      --p3: #7c3aed;
      --p4: #4c1d95;
      --bg: #04040e;
      --text: #ede9fe;
      --muted: #5e5677;
      --green: #86efac;
      --cyan: #67e8f9;
      --amber: #fcd34d;
    }

    html { height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND ─────────────────────────────────────────── */
    .bg-base {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 100% 70% at 50%  -5%,  rgba(88,28,220,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 60%  60% at 90%  85%,  rgba(124,58,237,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 45%  45% at 8%   75%,  rgba(103,232,249,0.06) 0%, transparent 55%),
        radial-gradient(ellipse 35%  35% at 55%  105%, rgba(192,132,252,0.10) 0%, transparent 55%),
        #04040e;
    }

    .blob {
      position: fixed; border-radius: 50%;
      pointer-events: none; filter: blur(100px); z-index: 0;
    }
    .blob1 {
      width: 700px; height: 700px; top: -280px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(88,28,220,0.20), transparent 70%);
      animation: drift1 22s ease-in-out infinite alternate;
    }
    .blob2 {
      width: 400px; height: 400px; bottom: 0; right: -80px;
      background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%);
      animation: drift2 17s ease-in-out infinite alternate;
    }
    .blob3 {
      width: 280px; height: 280px; bottom: 18%; left: -40px;
      background: radial-gradient(circle, rgba(103,232,249,0.07), transparent 70%);
      animation: drift3 14s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translateX(-50%) translateY(20px) scale(1.04); } }
    @keyframes drift2 { to { transform: translate(-20px,-30px) scale(1.08); } }
    @keyframes drift3 { to { transform: translate(25px,-20px) scale(1.05); } }

    .stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10%  15%, rgba(255,255,255,0.25), transparent),
        radial-gradient(1px 1px at 30%  40%, rgba(255,255,255,0.15), transparent),
        radial-gradient(1px 1px at 55%  8%,  rgba(255,255,255,0.20), transparent),
        radial-gradient(1px 1px at 72%  65%, rgba(255,255,255,0.12), transparent),
        radial-gradient(1px 1px at 88%  22%, rgba(255,255,255,0.18), transparent),
        radial-gradient(1px 1px at 15%  82%, rgba(255,255,255,0.10), transparent),
        radial-gradient(1px 1px at 45%  55%, rgba(255,255,255,0.08), transparent),
        radial-gradient(1.5px 1.5px at 63% 88%, rgba(192,132,252,0.30), transparent),
        radial-gradient(1.5px 1.5px at 22% 58%, rgba(192,132,252,0.20), transparent),
        radial-gradient(1.5px 1.5px at 80% 45%, rgba(103,232,249,0.20), transparent);
    }

    .grain {
      position: fixed; inset: 0; z-index: 998; pointer-events: none; opacity: 0.45;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    }

    .scanlines {
      position: fixed; inset: 0; z-index: 997; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.025) 3px, rgba(0,0,0,0.025) 4px);
    }

    /* ─── TOP ACCENT ─────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 1px; z-index: 200;
      background: linear-gradient(90deg, transparent 0%, rgba(109,40,217,0.6) 15%, rgba(192,132,252,0.9) 50%, rgba(109,40,217,0.6) 85%, transparent 100%);
      box-shadow: 0 0 50px 4px rgba(168,85,247,0.45), 0 0 100px 8px rgba(109,40,217,0.2);
    }

    /* ─── STATUS BAR ─────────────────────────────────────────── */
    .statusbar {
      position: fixed; top: 1px; left: 0; right: 0; z-index: 150;
      padding: 6px 28px;
      font-size: 9.5px; letter-spacing: 0.09em;
      color: var(--muted);
      background: rgba(4,4,14,0.50);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border-bottom: 1px solid rgba(168,85,247,0.08);
      display: flex; gap: 18px; align-items: center;
    }
    .dot-online {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px 2px rgba(134,239,172,0.6);
      animation: breathe 2.8s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }
    .statusbar .hi { color: var(--p1); font-weight: 500; }
    .statusbar .sep { opacity: 0.25; }
    .statusbar .right { margin-left: auto; color: rgba(168,85,247,0.22); font-size: 9px; }

    /* ─── LAYOUT ─────────────────────────────────────────────── */
    .container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 72px 24px 56px;
      gap: 18px;
    }

    /* ─── HERO ───────────────────────────────────────────────── */
    .hero-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      animation: fadeDown 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-20px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .hero-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(30px, 5.5vw, 46px);
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(140deg, rgba(255,255,255,0.95) 0%, var(--p1) 40%, #9333ea 75%, #6d28d9 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(168,85,247,0.30));
    }
    .hero-sub {
      font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
      color: rgba(168,85,247,0.40);
      font-weight: 300;
    }

    /* ─── TERMINAL ───────────────────────────────────────────── */
    .terminal {
      width: 100%; max-width: 600px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      animation: fadeUp 0.7s 0.12s cubic-bezier(.22,1,.36,1) both;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 60%, rgba(168,85,247,0.025) 100%);
      backdrop-filter: blur(22px) saturate(1.7) brightness(1.05);
      -webkit-backdrop-filter: blur(22px) saturate(1.7) brightness(1.05);
      border: 1px solid rgba(192,132,252,0.22);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.09),
        inset 0 -1px 0 rgba(0,0,0,0.35),
        0 2px 4px rgba(0,0,0,0.5),
        0 12px 40px rgba(0,0,0,0.6),
        0 0 80px rgba(109,40,217,0.15),
        0 0 140px rgba(109,40,217,0.08);
    }
    .terminal::before {
      content: '';
      position: absolute; top: 0; left: 8%; right: 8%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      pointer-events: none; z-index: 2;
    }
    .terminal::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(4,4,14,0.25));
      pointer-events: none; z-index: 2;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(32px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .terminal-bar {
      padding: 10px 16px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid rgba(192,132,252,0.10);
      background: rgba(255,255,255,0.02);
      position: relative;
    }
    .terminal-bar::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,0.20), transparent);
      pointer-events: none;
    }

    .tdot { width: 11px; height: 11px; border-radius: 50%; }
    .tdot.r { background: #ff5f57; box-shadow: 0 0 7px 1px rgba(255,95,87,0.55); }
    .tdot.y { background: #febc2e; box-shadow: 0 0 7px 1px rgba(254,188,46,0.45); }
    .tdot.g { background: #28c840; box-shadow: 0 0 7px 1px rgba(40,200,64,0.45); }

    .terminal-title {
      flex: 1; text-align: center;
      font-size: 9.5px; color: var(--muted); letter-spacing: 0.08em;
    }

    .terminal-body {
      padding: 22px 26px 28px;
      font-size: 12.5px; line-height: 1.9;
      min-height: 180px; position: relative; z-index: 1;
    }

    /* ─── DIVIDER ────────────────────────────────────────────── */
    .divider {
      width: 100%; max-width: 600px;
      display: flex; align-items: center; gap: 10px;
      animation: fadeUp 0.7s 0.28s cubic-bezier(.22,1,.36,1) both;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,0.18), transparent);
    }
    .divider-dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: rgba(168,85,247,0.35);
      box-shadow: 0 0 6px rgba(168,85,247,0.5);
    }

    /* ─── LINKS ──────────────────────────────────────────────── */
    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%; max-width: 600px;
      animation: fadeUp 0.7s 0.34s cubic-bezier(.22,1,.36,1) both;
    }

    .link-item {
      display: flex; align-items: center; gap: 11px;
      padding: 13px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: rgba(200,185,240,0.50);
      font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
      position: relative; overflow: hidden;
      transition: color 0.22s, transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.22s, border-color 0.22s, background 0.22s;
      background: linear-gradient(135deg, rgba(255,255,255,0.042) 0%, rgba(255,255,255,0.012) 100%);
      backdrop-filter: blur(16px) saturate(1.5);
      -webkit-backdrop-filter: blur(16px) saturate(1.5);
      border: 1px solid rgba(168,85,247,0.14);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.20),
        0 2px 12px rgba(0,0,0,0.30);
    }
    .link-item::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 10%, rgba(255,255,255,0.14) 50%, transparent 90%);
      pointer-events: none;
    }
    .link-item::after {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 2px; border-radius: 2px;
      background: linear-gradient(180deg, transparent, var(--p1), var(--p3), transparent);
      opacity: 0;
      transition: opacity 0.22s;
      box-shadow: 0 0 10px var(--p2);
    }
    .link-item:hover {
      color: rgba(237,233,254,0.90);
      border-color: rgba(192,132,252,0.40);
      background: linear-gradient(135deg, rgba(168,85,247,0.10) 0%, rgba(255,255,255,0.04) 100%);
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        inset 0 -1px 0 rgba(0,0,0,0.25),
        0 0 0 1px rgba(168,85,247,0.15),
        0 8px 32px rgba(109,40,217,0.20),
        0 2px 8px rgba(0,0,0,0.40);
    }
    .link-item:hover::after { opacity: 1; }
    .link-item svg {
      width: 13px; height: 13px; flex-shrink: 0;
      opacity: 0.30; transition: opacity 0.22s, filter 0.22s;
    }
    .link-item:hover svg {
      opacity: 0.80;
      filter: drop-shadow(0 0 4px rgba(192,132,252,0.6));
    }
    .link-label { position: relative; z-index: 1; }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    .footer {
      font-size: 9px; letter-spacing: 0.22em;
      color: rgba(168,85,247,0.16);
      animation: fadeUp 0.7s 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    /* ─── TERMINAL COLORS ────────────────────────────────────── */
    .pu  { color: var(--p1); }
    .dim { color: var(--muted); }
    .cy  { color: var(--cyan); }
    .gr  { color: var(--green); }
    .wh  { color: var(--text); }

    .type-cursor {
      display: inline-block; width: 6px; height: 13px;
      background: var(--p1); margin-left: 2px;
      vertical-align: middle; border-radius: 1px;
      animation: blink 1s step-end infinite;
      box-shadow: 0 0 14px rgba(192,132,252,0.95);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .out-line { opacity: 0; transition: opacity 0.12s; }
    .out-line.visible { opacity: 1; }

    @media (max-width: 500px) {
      .terminal-body { font-size: 11.5px; padding: 18px 18px 22px; }
      .links { grid-template-columns: 1fr; }
      .hero-name { font-size: 28px; }
      .container { gap: 15px; }
    }
  </style>
</head>

<script>
  const term = document.getElementById('term');
  const pu  = s => `<span class="pu">${s}</span>`;
  const cy  = s => `<span class="cy">${s}</span>`;
  const gr  = s => `<span class="gr">${s}</span>`;
  const wh  = s => `<span class="wh">${s}</span>`;
  const dim = s => `<span class="dim">${s}</span>`;
  const PROMPT = `${pu('╭─[')}${cy('0xRushi')}${dim('@')}${pu('arch-btw')}${pu(']')}${dim('──[~]')}<br>${pu('╰─❯')} `;
  const CURSOR = `<span class="type-cursor"></span>`;
  const sequence = [
    { type: 'cmd',  text: 'cat about.txt',  speed: 58 },
    { type: 'out',  html: `${dim('name    ')}${pu('▸ ')}${wh('Rushikesh Nerkar')}`,                            delay: 130 },
    { type: 'out',  html: `${dim('alias   ')}${pu('▸ ')}${cy('0xRushi')}`,                                     delay: 80  },
    { type: 'out',  html: `${dim('focus   ')}${pu('▸ ')}${wh('offensive sec · bug bounty · Cloud Security')}`, delay: 80  },
    { type: 'out',  html: `${dim('status  ')}${pu('▸ ')}${gr('actively pwning')}`,                             delay: 80  },
    { type: 'gap',  delay: 200 },
    { type: 'idle' },
  ];
  let html = '';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function run() {
    await sleep(650);
    for (const step of sequence) {
      if (step.type === 'cmd') {
        html += `<div class="out-line visible" id="cmdline">${PROMPT}${CURSOR}</div>`;
        term.innerHTML = html;
        const cmdLine = document.getElementById('cmdline');
        let typed = '';
        for (const ch of step.text) {
          await sleep(step.speed + Math.random() * 28);
          typed += ch;
          cmdLine.innerHTML = `${PROMPT}${wh(typed)}${CURSOR}`;
        }
        cmdLine.innerHTML = `${PROMPT}${wh(step.text)}`;
        cmdLine.removeAttribute('id');
        await sleep(170);
      } else if (step.type === 'out') {
        await sleep(step.delay);
        html = term.innerHTML;
        html += `<div class="out-line" id="nl">${step.html}</div>`;
        term.innerHTML = html;
        await sleep(16);
        const nl = document.getElementById('nl');
        if (nl) { nl.classList.add('visible'); nl.removeAttribute('id'); }
      } else if (step.type === 'gap') {
        await sleep(step.delay);
      } else if (step.type === 'idle') {
        html = term.innerHTML;
        html += `<div class="out-line visible"><br>${PROMPT}${CURSOR}</div>`;
        term.innerHTML = html;
      }
    }
  }
  run();
</script>
